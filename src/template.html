<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fablemon: Wild Roots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ui:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;--pix:"Pixelify Sans",var(--ui);--cream:#fbf3d9;--cream2:#efe2b8;--green:#1f4d2b;--green2:#2f6b3a;--gold:#f2c14e;--gold2:#d99a1e;--ink:#2a2420}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1d2b1d;font-family:var(--ui);font-variant-numeric:tabular-nums lining-nums;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0}
#game canvas{image-rendering:pixelated}
.panel{background:var(--cream);border:3px solid var(--green);border-radius:6px;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 2px var(--cream2)}
#hud{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
#hud > *{pointer-events:auto}
#clock{position:absolute;top:8px;left:8px;padding:5px 9px;font-weight:600;font-size:14px;line-height:1.15;min-width:120px}
#clock .t{font-size:18px;font-weight:700}
#clock .gold{font-size:15px;font-weight:700;color:#8a5a00;border-top:2px solid var(--cream2);margin-top:3px;padding-top:2px}
#topbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.sq{width:44px;height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.sq img{width:28px;height:28px;image-rendering:pixelated}
#energy{position:absolute;right:10px;bottom:76px;width:22px;height:min(120px,calc(100vh - 76px - 84px));padding:3px;display:flex;flex-direction:column;justify-content:flex-end}
#energy .fill{width:100%;background:linear-gradient(#7ee05a,#3a9a3a);border-radius:2px;transition:height .2s}
#energy .lbl{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 0 #000}
#hotbar{position:absolute;left:50%;bottom:max(8px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:2px;padding:4px}
.slot{position:relative;width:var(--s,34px);height:var(--s,34px);background:#e8d7a6;border:2px solid #b08a4a;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot img{width:78%;height:78%;image-rendering:pixelated;pointer-events:none}
.slot .n{position:absolute;right:1px;bottom:-2px;font-size:11px;font-weight:700;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;pointer-events:none}
.slot.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold2);background:#fff4cf}
.slot.pick{border-color:#e25a4a;box-shadow:0 0 0 2px #e25a4a}
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);padding:7px 12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:86vw;text-align:center}
#toast.show{opacity:1}
#night{position:fixed;inset:0;pointer-events:none;background:#141a46;opacity:0;z-index:3;mix-blend-mode:multiply}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;z-index:30}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:45;background:rgba(10,15,10,.45)}
.modal.show{display:flex}
.modal .panel{max-width:min(94vw,560px);width:min(94vw,560px);max-height:86vh;overflow:auto;padding:0 14px 12px;box-sizing:border-box;
  background:linear-gradient(#fbf3d9,#f4e6bf);border:4px solid #5e3b20;border-radius:8px;
  box-shadow:0 0 0 2px #2a1e1a,inset 0 0 0 3px #e8d49c,0 8px 0 rgba(0,0,0,.35),0 14px 30px rgba(0,0,0,.4)}
.modal h2{position:sticky;top:0;z-index:2;margin:0 -14px 10px;padding:9px 12px 9px 16px;font-size:20px;color:#fbf3d9;display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:repeating-linear-gradient(0deg,#8f5f34 0 5px,#875830 5px 6px),#8f5f34;border-bottom:4px solid #5e3b20;box-shadow:inset 0 2px 0 #b07a45,0 2px 0 #e8d49c;text-shadow:0 2px 0 #3a2414;letter-spacing:.5px}
.modal h2 .x{color:#fbf3d9;background:#5e3b20;border:2px solid #3a2414;border-radius:6px;width:32px;height:32px;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 2px 0 #8f5f34}
.btn{font-family:inherit;font-weight:800;font-size:15px;background:linear-gradient(#fffaea,#f0e2b8);color:var(--green);border:3px solid var(--green);border-radius:7px;padding:7px 14px;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(31,77,43,.18),0 3px 0 #173a20;transition:transform .05s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(31,77,43,.18),0 1px 0 #173a20}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.gold{border-color:#b8790e;background:linear-gradient(#ffe48a,#f2c14e);color:#5a3a00;box-shadow:inset 0 -3px 0 rgba(120,70,0,.25),0 3px 0 #8a5a08}
.btn:disabled{opacity:.45;cursor:default}
.x{font-family:inherit;font-weight:700;background:none;border:none;font-size:20px;color:var(--green);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(12,var(--s,34px));gap:2px;margin:4px 0}
.grid.hot{padding-bottom:6px;margin-bottom:6px;border-bottom:2px dashed #c9b27a}
.recipe{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #d8c48f;border-radius:6px;padding:6px 8px;margin-bottom:6px}
.recipe img{width:32px;height:32px;image-rendering:pixelated}
.recipe .g{flex:1}
.recipe b{display:block;font-size:15px}
.recipe small{font-size:13px;opacity:.8}
.letter{background:#fffaf0;border:2px solid #d8c48f;padding:12px 14px;font-size:15px;line-height:1.45;white-space:pre-line}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
p{margin:6px 0;font-size:15px;line-height:1.4}
label.opt{display:flex;align-items:center;gap:8px;font-size:15px;margin:8px 0}
#joy{position:absolute;left:14px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + var(--s,34px) + 26px);width:120px;height:120px;border-radius:50%;background:rgba(251,243,217,.22);border:3px solid rgba(31,77,43,.6);box-shadow:inset 0 0 0 2px rgba(251,243,217,.25);touch-action:none;display:none}
#joy .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--cream);border:3px solid var(--green);box-shadow:0 3px 0 rgba(0,0,0,.3);pointer-events:none}
#actBtn{position:absolute;right:42px;bottom:calc(max(8px,env(safe-area-inset-bottom)) + var(--s,34px) + 30px);width:70px;height:70px;border-radius:50%;background:var(--cream);border:3px solid var(--gold2);box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 0 0 3px #fff1c6;display:none;align-items:center;justify-content:center;touch-action:none;cursor:pointer;padding:0}
#actBtn img{width:34px;height:34px;image-rendering:pixelated;pointer-events:none}
#actBtn.down{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35),inset 0 0 0 3px #fff1c6}
body.touch #joy{display:block} body.touch #actBtn{display:flex}
body.touch #energy{bottom:calc(max(8px,env(safe-area-inset-bottom)) + var(--s,34px) + 112px);height:min(120px,calc(100vh - max(8px,env(safe-area-inset-bottom)) - var(--s,34px) - 112px - 84px))}
.slot .wb{position:absolute;left:3px;right:3px;bottom:2px;height:4px;background:#2a1e1a;border-radius:2px;overflow:hidden;pointer-events:none}
.slot .wb i{display:block;height:100%;background:linear-gradient(#8fd3ff,#3f97e0)}
.trashrow{display:flex;justify-content:flex-end;margin-top:4px}
.slot.trash{--s:40px;background:#e2d3b0}
.dragghost{position:fixed;width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;z-index:50;image-rendering:pixelated;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.slotpick{cursor:pointer}.slotpick.on{border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold)}
#clock .gold img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-2px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .08s}
input[type=range]{accent-color:#2f6b3a;flex:1}
#cloudNote{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);color:#fbf3d9;font-size:13px;font-weight:600;text-shadow:0 1px 2px #000;z-index:2;white-space:nowrap}
#intro{position:fixed;inset:0;z-index:60;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .45s;cursor:pointer;overflow:hidden}
#intro.on{opacity:1}
#intro .ibg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(18px) brightness(.45)}
#intro .frame{position:relative;width:min(100vw,calc((100vh - 150px) * 1.79),1200px);aspect-ratio:16/9;overflow:hidden;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#iimg{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .38s}
#iimg.kb{animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
#icap{position:relative;width:min(94vw,900px);margin-top:12px;padding:10px 14px 12px;min-height:84px;font-size:clamp(15px,2.3vw,20px);line-height:1.4}
#icap .who{font-weight:700;color:var(--green);font-size:.85em;margin-bottom:2px}
#icap .hint{position:absolute;right:10px;bottom:6px;color:var(--gold2);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#iskip{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;z-index:2}
@media (max-aspect-ratio: 1/1){#intro .frame{width:100vw}}
@media (max-height: 430px){#icap{position:absolute;bottom:8px;margin:0;min-height:0;background:rgba(251,243,217,.94)}#intro .frame{width:100vw;height:100vh;aspect-ratio:auto}}
/* title */
#title{position:fixed;inset:0;z-index:40;background:#1d2b1d;display:flex;align-items:center;justify-content:center}
#title .wrap{position:relative}
#title img{display:block;width:100%;height:100%}
#title .hit{position:absolute;cursor:pointer;border-radius:8px}
#title .hit:hover,#title .hit:active{box-shadow:0 0 0 3px rgba(242,193,78,.9)}
#title .hit.off{background:rgba(30,30,30,.45);cursor:default}
#title .bg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(14px) brightness(.6)}
#talk{position:fixed;left:50%;bottom:calc(var(--s,36px) + 26px);transform:translateX(-50%);width:min(94vw,640px);display:none;gap:10px;align-items:flex-start;padding:8px 10px 10px;z-index:44;cursor:pointer}
#talk.show{display:flex}
#tface{flex:0 0 auto;width:80px;height:80px;border:3px solid var(--green);border-radius:6px;background-color:#cfe3b2;background-repeat:no-repeat;background-size:320px 160px;image-rendering:pixelated}
#tbody{flex:1;min-width:0}
#tname{font-weight:700;color:var(--green);font-size:15px;display:flex;justify-content:space-between}
#tname .h{color:#c0392b;font-size:13px}
#ttext{font-size:16px;line-height:1.4;min-height:44px}
#tmore{position:absolute;right:10px;bottom:4px;color:var(--green);animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
.shoprow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:2px solid var(--cream2)}
.shoprow img{width:32px;height:32px;image-rendering:pixelated}
.shoprow .g{flex:1;min-width:0}
.shoprow .g b{display:block;font-size:15px}.shoprow .g small{font-size:13px;opacity:.85}
.need{display:inline-flex;align-items:center;gap:2px;margin-right:8px;font-size:13px;font-weight:700}
.need img{width:18px;height:18px}
.need.no{color:#b03a2e}
.proj{padding:8px 4px;border-bottom:2px solid var(--cream2)}
.proj b{font-size:15px}.proj .st{float:right;font-size:13px;font-weight:700;color:var(--green2)}
.mlist{max-height:min(60vh,460px);overflow:auto}
.tchip{display:inline-block;color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:4px;text-shadow:0 1px 0 rgba(0,0,0,.35);vertical-align:middle}
.hpb{display:inline-block;width:70px;height:7px;background:#3a2e26;border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:4px}.hpb i{display:block;height:100%}
#bTeam img{width:36px;height:36px}
#buildbar{position:fixed;left:50%;bottom:calc(var(--s,36px) + 26px);transform:translateX(-50%);width:min(94vw,520px);display:none;padding:8px 12px 10px;z-index:44;font-size:14px}
#buildbar.show{display:block}
#buildbar.side{left:auto;right:10px;top:62px;bottom:auto;transform:none;width:min(40vw,330px);max-height:calc(100vh - 74px);overflow:auto}
#buildbar .bt{font-size:17px;color:var(--green)}
#buildbar .legend{font-size:12px;margin:4px 0;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#buildbar .legend i{display:inline-block;width:12px;height:12px;border:1px solid #0004;margin-left:6px}
#buildbar .mv{display:flex;gap:6px;margin:4px 0}#buildbar .mv .btn{padding:4px 12px;font-size:14px}
#buildbar .row{display:flex;gap:8px;margin-top:4px}
#battle{position:fixed;inset:0;z-index:46;background:#1d2b1d;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding-top:max(4px,env(safe-area-inset-top))}
#battle.show{display:flex}#battle.side{flex-direction:row;justify-content:center;align-items:center;padding-top:0}
#bstage{position:relative;background-repeat:no-repeat;image-rendering:pixelated;overflow:hidden;flex:0 0 auto;border-radius:4px}
.bmon{position:absolute;image-rendering:pixelated;transform-origin:50% 100%}
#bfoe{width:calc(var(--w) * .2);left:calc(var(--fx) - var(--w) * .1);top:calc(52% - var(--w) * .2)}
#bme{width:calc(var(--w) * .27);left:calc(var(--mx) - var(--w) * .135);top:calc(80% - var(--w) * .27)}
.bbox{position:absolute;padding:4px 8px;font-size:clamp(11px,calc(var(--w) * .024),15px);min-width:min(42%,calc(var(--w) * .3))}
#bfoebox{left:2%;top:4%}#bmebox{right:2%;bottom:5%}
.bbox .bn{font-weight:700;color:var(--ink)}.bbox .tchip{font-size:10px}
.bhp{height:7px;background:#3a2e26;border-radius:3px;overflow:hidden;margin-top:3px}.bhp i{display:block;height:100%;transition:width .45s}
.bhpn{font-size:.85em;text-align:right;font-weight:700}
.bxp{height:4px;background:#d8cba0;margin-top:2px;border-radius:2px;overflow:hidden}.bxp i{display:block;height:100%;background:#3a8fd0;transition:width .6s}
#bui{flex:1 1 auto;max-height:calc(100vh - 8px);padding:8px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto;box-sizing:border-box}
#battle:not(.side) #bui{flex:0 0 auto;min-height:150px}
#bmsg{font-size:16px;line-height:1.35;min-height:44px;font-weight:600}
#bmenu{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#bmenu .btn{padding:8px 6px;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.15}
#bmenu .btn small{font-size:11px;font-weight:600;opacity:.8}#bmenu .eff{font-size:10px;font-weight:800;letter-spacing:.2px}#bmenu .eff.up{color:#1f7a2e}#bmenu .eff.dn{color:#9a4a20}#bmenu .eff.no{color:#7a7a7a}#bmenu .btn img{width:22px;height:22px;image-rendering:pixelated}
#battle.side #bmenu{grid-template-columns:1fr}
#bcharm{position:absolute;width:calc(var(--w) * .05);image-rendering:pixelated;left:var(--mx);top:70%;z-index:3}
#bcharm.hidden{display:none}
#bcharm.throw{animation:throw .6s ease-out forwards}
#bcharm.sit{animation:none;left:calc(var(--fx) - var(--w) * .025);top:calc(52% - var(--w) * .05)}
#bcharm.wobble{animation:wob .6s}
#bcharm.glow{filter:drop-shadow(0 0 6px #fff3a0)}
@keyframes throw{0%{left:var(--mx);top:70%}50%{top:20%}100%{left:calc(var(--fx) - var(--w) * .025);top:calc(52% - var(--w) * .05)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-25deg)}75%{transform:rotate(25deg)}}
.absorb{transform:scale(0) !important;opacity:0;transition:transform .35s,opacity .35s}
.lunge-me{animation:lme .26s}.lunge-foe{animation:lfoe .26s}
@keyframes lme{50%{transform:translate(8%,-6%)}}@keyframes lfoe{50%{transform:translate(-8%,6%)}}
.hurt{animation:hurt .45s}@keyframes hurt{0%,40%,80%{opacity:.15}20%,60%,100%{opacity:1}}
.buff{animation:buff .4s}@keyframes buff{50%{filter:brightness(1.8);transform:scale(1.06)}}
.debuff{animation:debuff .4s}@keyframes debuff{50%{filter:brightness(.5) saturate(.4);transform:scale(.95)}}
.faint{animation:faint .6s forwards}@keyframes faint{to{transform:translateY(40%);opacity:0}}
.enter-foe{animation:efoe .5s}@keyframes efoe{from{transform:translateX(60%);opacity:0}}
.enter-me{animation:eme .45s}@keyframes eme{from{transform:translateX(-60%) scale(.6);opacity:0}}
.modal h2,#mTitle,#tname>span:first-child,#icap .who,#buildbar .bt b,.bbox .bn,.bigtitle{font-family:var(--pix)}
body{-webkit-font-smoothing:antialiased}
/* game-styled menus */
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:8px;background:#fffaf0;border:3px solid #d8c48f;border-left:7px solid var(--tc);border-radius:8px;box-shadow:0 2px 0 #c9b278}
.mrow.lead{background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 14%,#fffaf0),#fffaf0 60%);border-color:#c9a64e}
.mrow .g{flex:1;min-width:0}
.mrow .mn{font-family:var(--pix);font-size:18px;font-weight:700;color:var(--ink);display:flex;align-items:baseline;gap:8px}

.showcase{flex:0 0 auto;width:120px;height:120px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;background:radial-gradient(ellipse at 50% 88%,rgba(0,0,0,.18) 0 22%,transparent 23%),linear-gradient(color-mix(in srgb,var(--tc) 30%,#fffaf0),#fffaf0);border:3px solid var(--tc);box-shadow:0 0 0 2px #2a1e1a}
.showcase img{width:104px;height:104px;image-rendering:pixelated;margin-bottom:4px}
.hpwrap{display:inline-flex;align-items:center;background:#2a1e1a;border-radius:4px;padding:2px 3px 2px 2px}
.hpl{font-size:9px;font-weight:900;color:#f2c14e;padding:0 3px;letter-spacing:.5px}
.hpb{width:74px;height:8px;background:#4a3a2e;border-radius:2px;margin:0}
.hpb i{background-image:linear-gradient(rgba(255,255,255,.35) 0 35%,transparent 35%) !important}
.hpn{font-size:13px;font-weight:800;color:#5e3b20}
.tchip{border:2px solid rgba(0,0,0,.25);text-transform:uppercase;letter-spacing:.5px;font-size:10px;padding:1px 6px}
.subbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;padding:6px 10px;background:#efe0b4;border:2px solid #d8c48f;border-radius:8px;font-size:14px}

.hint{font-size:13px;color:#6b5a3e;margin:6px 2px 0}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.jcard{position:relative;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 4px 6px;background:#fffaf0;border:3px solid var(--tc);border-radius:10px;box-shadow:0 3px 0 #c9b278;cursor:pointer}
.jcard img{width:52px;height:52px;image-rendering:pixelated}
.jcard.unknown{cursor:default;background:#ece0be}.jcard.unknown img{filter:brightness(0) opacity(.35)}
.jcard.seen img{filter:grayscale(.9) opacity(.7)}
.jn{position:absolute;top:3px;left:6px;font-size:11px;font-weight:800;color:#8a7a5e}
.showcase+div .jn{position:static}
.jc{position:absolute;top:2px;right:6px;color:#c0392b;font-size:12px}
.jname{font-family:var(--pix);font-size:14px;font-weight:700;color:var(--ink)}
.pixt{font-family:var(--pix)}
.shoprow,.recipe{background:#fffaf0;border:3px solid #d8c48f;border-radius:8px;box-shadow:0 2px 0 #c9b278;margin-bottom:8px;padding:6px 10px}
.proj{background:#fffaf0;border:3px solid #d8c48f;border-radius:8px;box-shadow:0 2px 0 #c9b278;margin-bottom:8px;padding:8px 10px}
#quest{position:absolute;top:110px;left:8px;max-width:min(52vw,240px);padding:5px 9px;font-size:13px;line-height:1.25;pointer-events:auto;cursor:pointer;background:linear-gradient(#fffaea,#f4e6bf)}
#quest:empty{display:none}
.evolving{left:calc(50% - var(--w) * .135) !important;top:calc(55% - var(--w) * .27) !important;animation:evoglow .5s infinite alternate}
.evolved{left:calc(50% - var(--w) * .135) !important;top:calc(55% - var(--w) * .27) !important;filter:drop-shadow(0 0 10px #fff6c0)}
@keyframes evoglow{from{filter:brightness(1)}to{filter:brightness(2.4) drop-shadow(0 0 12px #fff)}}
.mcard{background:#fffaf0;border:2px solid #d8c48f;border-left:6px solid var(--tc);border-radius:7px;padding:6px 9px;margin-bottom:6px;text-align:left}
.mcard .mh{display:flex;align-items:center;gap:6px;justify-content:space-between}.mcard .mh b{font-size:15px;flex:1}
.mcard .ms{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;margin:2px 0;color:#5e4a30}.mcard .ms b{color:var(--ink)}
.mcard .same{color:#2f6b3a;font-weight:800}.mcard small{font-size:12.5px;line-height:1.3;display:block}
.newtag{background:#e0503a;color:#fff;font-size:10px;font-weight:900;padding:1px 5px;border-radius:4px;margin-left:4px}
#bmsg .mcard{margin:0}
#loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#fbf3d9;font-size:20px;z-index:35}

.jmoves{display:flex;flex-direction:column;gap:3px}.jmv{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #d8c48f;border-left:5px solid var(--tc);padding:3px 6px;font-size:13px}.jmv b{flex:1;font-family:var(--pix);font-size:14px}.jmv .jl{width:42px;font-weight:800;color:#5e3b20}.jmv small{opacity:.75;min-width:64px;text-align:right}
/* ---------- pixel-art finish: square, chunky frames and a pixel font; numbers stay in the clear font */
.panel,.modal .panel,.btn,.slot,.recipe,.proj,.shoprow,.mcard,.mrow,.jcard,.letter,.modal h2 .x,.tchip,.need,.mbadge,.showcase,#talk,#tface,#bmenu .btn,.bbox,#bmsg,#quest,#energy,#energy .fill,.subbar,.hint,input{border-radius:0 !important}
.panel,#talk{box-shadow:0 0 0 2px #2a1e1a,inset 0 0 0 2px var(--cream2),4px 4px 0 rgba(0,0,0,.35) !important}
.modal .panel{box-shadow:0 0 0 3px #2a1e1a,inset 0 0 0 3px #e8d49c,6px 6px 0 rgba(0,0,0,.4) !important}
.btn{font-family:var(--pix);font-weight:700;letter-spacing:.3px;box-shadow:inset -3px -3px 0 rgba(31,77,43,.18),inset 3px 3px 0 rgba(255,255,255,.6),3px 3px 0 #173a20}
.btn.gold{box-shadow:inset -3px -3px 0 rgba(120,70,0,.25),inset 3px 3px 0 rgba(255,255,255,.55),3px 3px 0 #8a5a08}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:inset -2px -2px 0 rgba(31,77,43,.18),1px 1px 0 #173a20}
#toast,#ttext,#tname,#quest,.recipe b,.shoprow b,.proj b,.tchip,.subbar,#bmsg,.mcard b{font-family:var(--pix)}
#ttext{font-size:17px;letter-spacing:.2px}
.recipe b,.shoprow b,.proj b{font-weight:700}
.slot{box-shadow:inset 2px 2px 0 rgba(255,255,255,.45),inset -2px -2px 0 rgba(120,80,30,.25)}
.slot.sel{box-shadow:0 0 0 2px var(--gold2),inset 2px 2px 0 rgba(255,255,255,.6)}
.num{font-family:var(--ui);font-weight:800;letter-spacing:0}
/* ---------- root frames: pixel-art roots as the border of every menu (9-slice border-image) */
.modal .panel,#talk,#bui,#icap,#buildbar{border-style:solid !important;border-width:16px !important;border-color:transparent !important;border-image:url(__FRAME_BIG__) 12 round !important;background-clip:padding-box !important;image-rendering:pixelated;box-shadow:none !important;filter:drop-shadow(4px 5px 0 rgba(0,0,0,.35))}
#clock,#quest,#hotbar,#toast,.bbox,#topbtns .sq,#ctlbar,#qty .panel{border-style:solid !important;border-width:9.333px !important;border-color:transparent !important;border-image:url(__FRAME_SM__) 7 round !important;background-clip:padding-box !important;image-rendering:pixelated;box-shadow:none !important;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35))}
#topbtns .sq{width:50px;height:50px}
@media (orientation: portrait){#topbtns{flex-direction:column;gap:4px}}
#clock{padding:3px 8px}#quest{padding:3px 8px}#hotbar{padding:2px}
/* control layout editor */
body.ctlEdit #joy,body.ctlEdit #actBtn{display:flex !important;outline:3px dashed var(--gold);outline-offset:4px;cursor:move;z-index:60}
body.ctlEdit #joy{display:block !important}
#ctlbar{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:61;width:min(86vw,360px);max-height:80vh;overflow:auto;padding:8px 12px;display:none;font-size:14px}
#ctlbar label span{min-width:96px}
body.ctlEdit #ctlbar{display:block}
#ctlbar label{display:flex;align-items:center;gap:8px;margin:4px 0}#ctlbar input{flex:1}
#ctlbar .row{display:flex;gap:6px;margin-top:6px}
#ctlbar,.modal .panel,#talk,#bui,#icap,#buildbar{}
.modal .panel{padding:0 8px 8px}
.modal h2{margin:0 -8px 10px}
#talk{padding:2px 4px 4px;bottom:calc(var(--s,36px) + 44px) !important}
/* world map */
.wmap{position:relative;width:100%;line-height:0;border:3px solid #5e3b20;background:#3ab0d0}
.wmap img{width:100%;display:block;image-rendering:auto}
.wfog{position:absolute;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(rgba(30,40,50,.62) 35%,rgba(30,40,50,0) 70%);pointer-events:none}
.wpin{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:2px;line-height:1.1;white-space:nowrap}
.wpin b{font:700 11px var(--pix);color:#2a1e1a;background:rgba(251,243,217,.92);border:2px solid #5e3b20;padding:1px 4px}
.wpin.unseen b{color:#e8e0cc;background:rgba(40,40,46,.7);border-color:#1e1e22}
.wpin.here b{background:#ffe9a0;border-color:#d99a1e}
.wyou{position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:#d04030;font-style:normal;font-size:14px;text-shadow:0 1px 0 #fff}
.wbadge{font:700 10px var(--ui);background:#f2c14e;color:#412402;border:2px solid #854f0b;border-radius:50%;width:17px;height:17px;display:inline-flex;align-items:center;justify-content:center}
.wbadge.won{background:#7cc24a;color:#173404;border-color:#3b6d11}
/* label sides: l = to the left of the spot, b = below, t = above */
.wpin.al-l{transform:translate(calc(-100% + 8px),-50%)}.wpin.al-b{transform:translate(-50%,40%)}.wpin.al-t{transform:translate(-50%,-140%)}
#wmapInfo{margin-top:6px;min-height:40px;line-height:1.4}
/* map */
.mapg{display:grid;grid-template-columns:repeat(7,auto);gap:2px;align-items:center;justify-items:center;overflow-x:auto;padding-bottom:4px}
.mapc{background:#fffaea;border:2px solid #b89a6a;padding:5px 6px;min-width:96px;max-width:130px;font-size:12px;display:flex;flex-direction:column;gap:1px}
.mapc b{font-family:var(--pix);font-size:13px}.mapc small{font-size:11px;line-height:1.25}.mapc i{font-size:11px;color:#b5651d;font-weight:700}
.mapc.here{border-color:#d99a1e;box-shadow:0 0 0 2px #f2c14e}.mapc.unseen{opacity:.55;background:#e8dcc0}
.mapl{font-size:18px;color:#5e3b20;text-align:center}.mapl small{display:block;font-size:10px}
#qty{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(10,15,10,.35)}
#qty.show{display:flex}
#qty .panel{width:min(86vw,340px);padding:10px 14px 12px}
#qty .qh{display:flex;align-items:center;gap:10px;font-family:var(--pix);font-weight:700;font-size:17px;margin-bottom:8px}
#qty .qh img{width:36px;height:36px;image-rendering:pixelated}
#qty .qrow{display:flex;align-items:center;gap:8px;justify-content:center}
#qty .qrow .btn{min-width:44px;font-size:20px;padding:4px 0}
#qty input[type=number]{width:84px;font:700 22px var(--ui);text-align:center;padding:4px;border:3px solid var(--green);background:#fffaea}
#qty input[type=range]{width:100%;margin:10px 0 6px}
#qty .quick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#qty .quick .btn{padding:3px 10px;font-size:13px}
#qty .tot{text-align:center;margin:8px 0 2px;font-weight:700}
</style>
</head>
<body>

<div id="ctlbar" class="panel"><b style="font-family:var(--pix)">Move and resize the HUD</b><div style="font-size:12px;opacity:.8">Drag the joystick and the action button to where you want them. Use the sliders to size each part of the screen.</div><label><span>Joystick</span> <input type="range" id="ctlJs" min=".6" max="1.8" step=".05"></label><label><span>Action button</span> <input type="range" id="ctlAs" min=".6" max="1.8" step=".05"></label><div id="hudSizes"></div><div class="row"><button class="btn" id="ctlReset">Reset</button><button class="btn gold" id="ctlDone">Done</button></div></div>
